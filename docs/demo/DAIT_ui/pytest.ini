[pytest]
testpaths = tests/unit
pythonpath = . src/backend/src
addopts = --strict-markers --tb=short
asyncio_default_fixture_loop_scope = function
markers =
    ut(*ids): document UT identifiers covered by this check
    spec_gap: document expectation differs from current implementation (must not skip/xfail)
    extension: current feature outside the document's explicit unit cases
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
