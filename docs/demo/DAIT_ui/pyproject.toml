[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dait-news"
version = "0.2.0"
description = "DAIT news curation backend"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["dait", "dait.core", "dait.api", "dait.api.v1", "dait.repositories", "dait.services", "dait.pipelines", "frontend"]
package-dir = {dait = "src/backend/src/dait", frontend = "src/frontend/src/frontend"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
frontend = ["assets/*.css", "assets/*.js", "legacy/*.html"]
