[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dait-news"
version = "0.2.0"
description = "DAIT news curation backend"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["dait", "dait.core", "dait.api", "dait.api.v1", "dait.repositories", "dait.services", "dait.pipelines", "frontend", "backend", "backend.pipelines", "backend.services"]
package-dir = {dait = "src/backend/src/dait", frontend = "src/frontend/src/frontend", backend = "src/backend/src/backend"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
frontend = ["assets/*.css", "assets/*.js", "legacy/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = [".", "src/backend/src", "src/frontend/src"]
addopts = "--strict-markers --tb=short"
asyncio_default_fixture_loop_scope = "function"
markers = ["ut(*ids): document UT identifiers covered by this check", "spec_gap: document expectation differs from current implementation (must not skip/xfail)", "extension: current feature outside the document's explicit unit cases", "ui: Playwright browser automation (python -m pytest tests/ui --browser chromium --browser webkit)"]
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["archive", ".venv", ".test-venv", ".tmp", "tests/legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src/backend/src/dait", "src/frontend/src/frontend", "tests/unit"]
exclude = ["archive", ".venv", ".test-venv", ".tmp", "tests/legacy"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
pythonPlatform = "Windows"
extraPaths = ["src/backend/src", "src/frontend/src"]
