[project]
name = "dait"
version = "0.1.0"
description = "DAIT mono-repo: dev tooling (ruff, pyright)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "chromadb==1.5.9",
    "deep-translator>=1.11.4",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "feedparser==6.0.14",
    "flask==3.1.3",
    "httpx>=0.28.1",
    "playwright>=1.64.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "psycopg[binary]>=3.3.8",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sentence-transformers==6.2.0",
    "sqlalchemy[asyncio]>=2.0",
    "streamlit>=1.67.0",
    "supabase>=2.34.0",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pip-audit>=2.10.1",
    "pyright>=1.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = [".", "src/backend/src", "tests/backend/tests"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src/backend/src", "src/backend/app", "tests/backend/tests"]
extend-exclude = ["docs", ".venv", "work"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF",
  "S",
  "DTZ",
  "T20",
  "BLE",
  "ASYNC",
  "TRY", "LOG", "G",
  "PT",
  "ANN401",
  "PLE", "PLW",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/backend/migrations/**" = ["E501"]

[tool.pyright]
include = ["src/backend/src", "src/backend/app", "tests/backend/tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
extraPaths = [".", "src/backend/src", "tests/backend/tests"]
stubPath = "typings"
venvPath = "."
venv = ".venv"
