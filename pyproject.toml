[project]
name = "dait"
version = "0.1.0"
description = "DAIT mono-repo: dev tooling (ruff, pyright)"
requires-python = ">=3.11"
dependencies = [
    "chromadb==1.5.9",
    "fastapi>=0.162.0",
    "feedparser==6.0.14",
    "flask==3.1.3",
    "httpx>=0.28",
    "playwright>=1.64.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sentence-transformers==6.2.0",
    "streamlit>=1.67.0",
    "supabase>=2.34.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pyright>=1.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
extraPaths = ["docs/demo/test-demo", "src/backend/src"]

[tool.pytest.ini_options]
pythonpath = ["src/backend/src"]
testpaths = ["tests/backend"]
