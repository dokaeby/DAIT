<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>다잇 (DAIT) - 기사 상세 및 3줄 요약</title>
  <link rel="stylesheet" href="/mockup/mockup.css" />
</head>
<body>
  <header>
    <div class="container header-inner">
      <a href="/" class="brand">
        <span class="brand-badge">DAIT BRIEFING</span>
        <h1>다잇 (DAIT) 뉴스 큐레이션</h1>
      </a>
      <div class="controls" style="display:flex;align-items:center;gap:0.8rem;">
        <a href="/" class="refresh-btn" style="text-decoration: none;">← 전체 뉴스 목록</a>
        <a class="settings-gear" href="/settings.html" aria-label="설정" title="설정">⚙</a>
        <div id="auth-area"></div>
      </div>
    </div>
  </header>

  <div class="container app-layout">
    <!-- 좌측 사이드바: 3대 카테고리 & 15개 하위 키워드 아코디언 트리 -->
    <aside class="sidebar" aria-label="카테고리 및 키워드 탐색">
      <div class="sidebar-header">
        <h2 class="sidebar-title">카테고리 · 키워드</h2>
        <span class="sidebar-subtitle">클릭 시 해당 목록으로 이동</span>
      </div>

      <ul class="category-tree">
        <li class="tree-group open" data-category="AI">
          <button type="button" class="tree-category-btn active" data-category="AI" aria-expanded="true">
            <span class="tree-category-label">AI</span>
            <span class="tree-chevron" aria-hidden="true">▾</span>
          </button>
          <ul class="tree-keywords">
            <li><button type="button" class="tree-keyword-btn" data-category="AI" data-keyword="모델·연구">모델·연구</button></li>
            <li><button type="button" class="tree-keyword-btn" data-category="AI" data-keyword="AI 에이전트">AI 에이전트</button></li>
            <li><button type="button" class="tree-keyword-btn" data-category="AI" data-keyword="개발 도구">개발 도구</button></li>
            <li><button type="button" class="tree-keyword-btn" data-category="AI" data-keyword="오픈소스·로컬 모델">오픈소스·로컬 모델</button></li>
            <li><button type="button" class="tree-keyword-btn" data-category="AI" data-keyword="AI 인프라">AI 인프라</button></li>
          </ul>
        </li>

        <li class="tree-group" data-category="ECONOMY">
          <button type="button" class="tree-category-btn" data-category="ECONOMY" aria-expanded="false">
            <span class="tree-category-label">경제·비즈니스</span>
            <span class="tree-chevron" aria-hidden="true">▾</span>
          </button>
          <ul class="tree-keywords">
            <li><button type="button" class="tree-keyword-btn" data-category="ECONOMY" data-keyword="산업 동향">산업 동향</button></li>
            <li><button type="button" class="tree-keyword-btn" data-category="ECONOMY" data-keyword="기업·경영">기업·경영</button></li>
            <li><button type="button" class="tree-keyword-btn" data-category="ECONOMY" data-keyword="스타트업·투자">스타트업·투자</button></li>
            <li><button type="button" class="tree-keyword-btn" data-category="ECONOMY" data-keyword="금융시장">금융시장</button></li>
            <li><button type="button" class="tree-keyword-btn" data-category="ECONOMY" data-keyword="일자리">일자리</button></li>
          </ul>
        </li>

        <li class="tree-group" data-category="SOCIETY">
          <button type="button" class="tree-category-btn" data-category="SOCIETY" aria-expanded="false">
            <span class="tree-category-label">사회·문화</span>
            <span class="tree-chevron" aria-hidden="true">▾</span>
          </button>
          <ul class="tree-keywords">
            <li><button type="button" class="tree-keyword-btn" data-category="SOCIETY" data-keyword="정책·제도">정책·제도</button></li>
            <li><button type="button" class="tree-keyword-btn" data-category="SOCIETY" data-keyword="교육">교육</button></li>
            <li><button type="button" class="tree-keyword-btn" data-category="SOCIETY" data-keyword="건강·의료">건강·의료</button></li>
            <li><button type="button" class="tree-keyword-btn" data-category="SOCIETY" data-keyword="환경·기후">환경·기후</button></li>
            <li><button type="button" class="tree-keyword-btn" data-category="SOCIETY" data-keyword="문화·콘텐츠">문화·콘텐츠</button></li>
          </ul>
        </li>
      </ul>
    </aside>

    <!-- 우측 상세 본문 영역 -->
    <main class="main-panel">
      <div class="status-bar">
        <span id="detailMeta">기사 상세 정보를 불러오는 중입니다...</span>
        <span id="detailApiPill" class="api-pill">GET /v1/news/{id}</span>
      </div>

      <section id="detailContainer"></section>
    </main>
  </div>

  <script>
    const GLOBAL_SOURCES = new Set([
      "TechCrunch",
      "MIT Tech Review",
      "MIT Technology Review",
      "The Verge",
    ]);

    const detailContainer = document.getElementById("detailContainer");
    const detailMeta = document.getElementById("detailMeta");
    const detailApiPill = document.getElementById("detailApiPill");
    const categoryButtons = document.querySelectorAll(".tree-category-btn");
    const keywordButtons = document.querySelectorAll(".tree-keyword-btn");

    for (const catBtn of categoryButtons) {
      catBtn.addEventListener("click", () => {
        const cat = catBtn.getAttribute("data-category") || "AI";
        window.location.href = `/?category=${encodeURIComponent(cat)}`;
      });
    }

    for (const kwBtn of keywordButtons) {
      kwBtn.addEventListener("click", () => {
        const cat = kwBtn.getAttribute("data-category") || "AI";
        const kw = kwBtn.getAttribute("data-keyword") || "";
        window.location.href = `/?category=${encodeURIComponent(cat)}&q=${encodeURIComponent(kw)}`;
      });
    }

    async function loadDetail() {
      const params = new URLSearchParams(window.location.search);
      const newsId = params.get("id");
      if (!newsId) {
        detailMeta.textContent = "기사 ID가 지정되지 않았습니다.";
        return;
      }

      try {
        const res = await fetch(`/v1/news/${encodeURIComponent(newsId)}`, {
          headers: { Accept: "application/json" },
        });
        const data = await res.json();
        if (!res.ok) {
          detailApiPill.className = "api-pill error";
          detailApiPill.textContent = `HTTP ${res.status}`;
          detailMeta.textContent = data?.error?.message || "기사를 찾을 수 없습니다.";
          return;
        }

        detailApiPill.className = "api-pill";
        detailApiPill.textContent = "API 200 OK";
        detailMeta.textContent = `카테고리: ${data.article.category} · 출처: ${data.article.source_name}`;

        const globalArticle = GLOBAL_SOURCES.has(data.article.source_name);
        const card = document.createElement("article");
        card.className = "news-card";

        const header = document.createElement("div");
        header.className = "card-header";

        const metaLeft = document.createElement("div");
        metaLeft.className = "card-meta-left";

        const regionBadge = document.createElement("span");
        regionBadge.className = globalArticle ? "region-badge global" : "region-badge domestic";
        regionBadge.textContent = globalArticle ? "[해외 외신]" : "[국내 언론]";

        const sourceTag = document.createElement("span");
        sourceTag.className = "source-tag";
        sourceTag.textContent = data.article.source_name;

        const statusBadge = document.createElement("span");
        statusBadge.className = "status-badge";
        statusBadge.textContent = `${data.content.content_status} · 3줄 요약`;

        metaLeft.appendChild(regionBadge);
        metaLeft.appendChild(sourceTag);
        metaLeft.appendChild(statusBadge);

        const publishedTime = document.createElement("time");
        publishedTime.className = "published-time";
        publishedTime.textContent = new Date(data.article.published_at).toLocaleString("ko-KR");

        header.appendChild(metaLeft);
        header.appendChild(publishedTime);

        const rawTitle = String(data.article.title || "");
        const titleParts = rawTitle.split(" ||| ");
        const originalTitle = titleParts[0] ? titleParts[0].trim() : rawTitle;
        const translatedTitle =
          titleParts.length > 1 ? titleParts.slice(1).join(" ").trim() : "";

        const title = document.createElement("h2");
        title.className = "card-title";
        title.textContent = originalTitle;

        let translatedSubtitle = null;
        if (translatedTitle) {
          translatedSubtitle = document.createElement("p");
          translatedSubtitle.className = "card-translated-title";
          translatedSubtitle.textContent = `번역 : ${translatedTitle}`;
        }

        const summaryList = document.createElement("ul");
        summaryList.className = globalArticle ? "summary-list global-summary" : "summary-list";
        for (const line of data.content.summary_lines || []) {
          const li = document.createElement("li");
          li.className = "summary-item";
          li.textContent = line;
          summaryList.appendChild(li);
        }

        card.appendChild(header);
        card.appendChild(title);
        if (translatedSubtitle) {
          card.appendChild(translatedSubtitle);
        }
        card.appendChild(summaryList);

        // 해외 기사: 저장된 본문 번역(translated_body)을 접이식 섹션으로 표시한다.
        const translatedBody = String(data.content.translated_text || "").trim();
        if (globalArticle && translatedBody.length > 200) {
          const bodySection = document.createElement("div");
          bodySection.className = "translated-body";

          const bodyToggle = document.createElement("button");
          bodyToggle.type = "button";
          bodyToggle.className = "summary-toggle-btn";
          bodyToggle.textContent = "[본문 번역 보기]";
          bodyToggle.setAttribute("aria-expanded", "false");

          const bodyText = document.createElement("p");
          bodyText.className = "translated-body-text";
          bodyText.textContent = translatedBody;
          bodyText.style.display = "none";

          bodyToggle.addEventListener("click", () => {
            const isOpen = bodyText.style.display !== "none";
            bodyText.style.display = isOpen ? "none" : "block";
            bodyToggle.textContent = isOpen ? "[본문 번역 보기]" : "[본문 번역 닫기]";
            bodyToggle.setAttribute("aria-expanded", isOpen ? "false" : "true");
          });

          bodySection.appendChild(bodyToggle);
          bodySection.appendChild(bodyText);
          card.appendChild(bodySection);
        }

        const footer = document.createElement("div");
        footer.className = "card-footer";

        const toggleBtn = document.createElement("button");
        toggleBtn.type = "button";
        toggleBtn.className = "summary-toggle-btn";
        toggleBtn.textContent = "[요약문 보기]";
        toggleBtn.setAttribute("aria-expanded", "false");
        toggleBtn.addEventListener("click", () => {
          const isOpen = summaryList.classList.toggle("open");
          toggleBtn.textContent = isOpen ? "[요약문 닫기]" : "[요약문 보기]";
          toggleBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
        });
        footer.appendChild(toggleBtn);

        const originalLink = document.createElement("a");
        originalLink.className = "primary-button";
        originalLink.href = String(data.source.original_url);
        originalLink.target = "_blank";
        originalLink.rel = "noopener noreferrer";
        originalLink.textContent = "원문 보기 →";
        footer.appendChild(originalLink);

        card.appendChild(footer);
        detailContainer.replaceChildren(card);
      } catch (_err) {
        detailApiPill.className = "api-pill error";
        detailApiPill.textContent = "오류";
        detailMeta.textContent = "상세 데이터를 불러오지 못했습니다.";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      void loadDetail();
    });
  </script>
    <script src="/app.js"></script>
  </body>
</html>
